name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts (build + tests)
    runs-on: ubuntu-latest
    env:
      HAS_FORK_RPC: ${{ secrets.BASE_MAINNET_RPC_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build (prints contract sizes; EIP-170 limit is 24,576 bytes)
        run: forge build --sizes
      - name: Unit, hostile, regime and invariant tests (no RPC needed)
        run: forge test --no-match-path "test/*.fork.t.sol" -vv
      - name: Base fork tests (only when a BASE_MAINNET_RPC_URL secret is configured)
        if: env.HAS_FORK_RPC == 'true'
        env:
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
          FORK_BLOCK: ${{ vars.FORK_BLOCK }}
        run: forge test --match-path "test/*.fork.t.sol" -vv

  keeper:
    name: Keeper (type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keeper/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  backtest:
    name: Backtest scripts (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile backtest/*.py
